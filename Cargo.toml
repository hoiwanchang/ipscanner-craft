[package]
name = "ipscanner-craft"
version = "1.0.2"
description = "Fast, portable IP range and CIDR network scanner with GUI, CLI and MCP server"
authors = ["Kane Chang"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ipscanner_craft_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "ipscanner-craft"
path = "src/main.rs"

[[bin]]
name = "ipscanner-craft-cli"
path = "src/bin/ipscan-cli.rs"

[[bin]]
name = "ipscanner-craft-mcp"
path = "src/bin/ipscan-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dns-lookup = "2"
base64 = "0.22"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
